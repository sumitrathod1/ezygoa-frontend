<mat-toolbar class="custom-toolbar">
  <button
    mat-icon-button
    [matMenuTriggerFor]="menu"
    aria-label="Company Logo Menu"
    class="logo-button"
  >
    <img src="assets/Ezy.png" alt="Logo" class="logo-image" />
  </button>

  <span class="app-title">Ezy</span>

  <span class="example-spacer"></span>
</mat-toolbar>

<mat-menu #menu="matMenu">
  <button mat-menu-item routerLink="/employee">Drivers</button>
  <button mat-menu-item (click)="addVehicle()">Add Vehicle</button>
  <button mat-menu-item routerLink="/email-booking">Enquery</button>
  <button mat-menu-item routerLink="/vendor-settlements">Extra</button>
  <button mat-menu-item routerLink="/business-hub">
    <i class="bi bi-briefcase-fill" style="margin-right:6px;color:#0d6e6e"></i> Business Hub
  </button>
  <button mat-menu-item routerLink="/document-vault">
    <i class="bi bi-folder2-open" style="margin-right:6px;color:#0d6e6e"></i> Document Vault
  </button>
  <button mat-menu-item routerLink="/bulk-upload">
    <i class="bi bi-cloud-upload-fill" style="margin-right:6px;color:#0d6e6e"></i> Bulk Upload
  </button>
  <button mat-menu-item (click)="onLogout()">Logout</button>
</mat-menu>
