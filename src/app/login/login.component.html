<div class="login-page">
  <div class="login-container">
    <div class="logo">
      <img src="assets/Ezy.png" alt="Logo" class="logo-image" />
    </div>
    <h2>Welcome Back</h2>
    <p>Sign in to continue</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group password-group">
        <i class="bi bi-person"></i>
        <input
          type="text"
          formControlName="username"
          placeholder="User ID"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group password-group">
        <i class="bi bi-lock"></i>
        <input
          [type]="showNewPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <i
          class="bi"
          [ngClass]="showNewPassword ? 'bi-eye-slash' : 'bi-eye'"
          (click)="togglePassword('new')"
        ></i>
      </div>

      <div class="forget-password">
        <a (click)="viewForget()">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn" [disabled]="isLoading || loginForm.invalid">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
        <i *ngIf="!isLoading" class="bi bi-box-arrow-in-right"></i>
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
