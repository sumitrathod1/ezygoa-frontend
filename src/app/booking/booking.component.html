<div class="container mt-3">

  <!-- KPI Cards -->
  <div class="row g-3 mb-3">
    <div class="col-6 col-md">
      <a class="kpi-card total text-decoration-none d-block" routerLink="/booking-table">
        <i class="bi bi-calendar2-check kpi-icon"></i>
        <div class="kpi-value">{{ totalBookings }}</div>
        <div class="kpi-label">Total Bookings</div>
      </a>
    </div>
    <div class="col-6 col-md">
      <a class="kpi-card revenue text-decoration-none d-block" routerLink="/earnings">
        <i class="bi bi-cash-stack kpi-icon"></i>
        <div class="kpi-value">{{ totalRevenue | indianCurrency }}</div>
        <div class="kpi-label">Total Revenue</div>
      </a>
    </div>
    <div class="col-4 col-md">
      <div class="kpi-card pending">
        <i class="bi bi-clock kpi-icon"></i>
        <div class="kpi-value">{{ pendingCount }}</div>
        <div class="kpi-label">Pending</div>
      </div>
    </div>
    <div class="col-4 col-md">
      <div class="kpi-card completed">
        <i class="bi bi-check-circle kpi-icon"></i>
        <div class="kpi-value">{{ completedCount }}</div>
        <div class="kpi-label">Completed</div>
      </div>
    </div>
    <div class="col-4 col-md">
      <div class="kpi-card cancelled">
        <i class="bi bi-x-circle kpi-icon"></i>
        <div class="kpi-value">{{ cancelledCount }}</div>
        <div class="kpi-label">Cancelled</div>
      </div>
    </div>
  </div>

  <!-- Charts -->
  <div class="row g-4 mt-1">
    <div class="col-12 col-md-6">
      <div class="card p-3 chart-card shadow-effect">
        <h5>Monthly Bookings</h5>
        <canvas baseChart [data]="barChartData" [type]="barChartType" [options]="barChartOptions"></canvas>
      </div>
    </div>
    <div class="col-12 col-md-6">
      <div class="card p-3 chart-card shadow-effect">
        <h5>Bookings by Type</h5>
        <canvas baseChart [data]="pieChartData" [type]="pieChartType" [options]="pieChartOptions"></canvas>
      </div>
    </div>
  </div>

</div>
