<div class="vf-dialog">
  <!-- Header -->
  <div class="vf-header expense-header">
    <div class="vf-header-icon"><i class="bi bi-cash-coin"></i></div>
    <div class="vf-header-text">
      <div class="vf-header-title">{{ isEditMode ? 'Edit Expense' : 'Add Expense' }}</div>
      <div class="vf-header-sub">Record vehicle expenditure</div>
    </div>
    <button class="vf-close-btn" type="button" (click)="onCloseExpense()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- Body -->
  <div class="vf-body">
    <form [formGroup]="expenseForm" (ngSubmit)="onExpenseFormSubmit()">

      <!-- Date + Category -->
      <div class="vf-row-2">
        <div class="vf-field">
          <label class="vf-label">
            <i class="bi bi-calendar3 vf-lbl-icon"></i> Expense Date
          </label>
          <input class="vf-input" type="date" formControlName="expenseDate" />
          <span class="vf-err"
            *ngIf="expenseForm.get('expenseDate')?.touched && expenseForm.get('expenseDate')?.invalid">
            Date required
          </span>
        </div>
        <div class="vf-field">
          <label class="vf-label">
            <i class="bi bi-tag-fill vf-lbl-icon"></i> Category
          </label>
          <select class="vf-select" formControlName="categoryType">
            <option value="" disabled>Select type</option>
            <option *ngFor="let cat of CategoryType" [value]="cat">{{ cat }}</option>
          </select>
        </div>
      </div>

      <!-- Vehicle (Employee only) -->
      <div class="vf-field" *ngIf="role === 'Employee'">
        <label class="vf-label">
          <i class="bi bi-truck vf-lbl-icon"></i> Vehicle
        </label>
        <select class="vf-select" formControlName="vehicle">
          <option value="" disabled>Select vehicle</option>
          <option *ngFor="let v of vehcilesType" [value]="v.vehicleId">
            {{ v.vehicleName }}
          </option>
        </select>
      </div>

      <!-- Amount -->
      <div class="vf-field">
        <label class="vf-label">
          <i class="bi bi-currency-rupee vf-lbl-icon"></i> Amount (₹)
        </label>
        <input
          class="vf-input"
          type="number"
          placeholder="Enter amount"
          min="1"
          formControlName="amount"
        />
        <span class="vf-err"
          *ngIf="expenseForm.get('amount')?.touched && expenseForm.get('amount')?.invalid">
          Valid amount required
        </span>
      </div>

      <!-- Notes -->
      <div class="vf-field">
        <label class="vf-label">
          <i class="bi bi-chat-left-text vf-lbl-icon"></i> Notes
        </label>
        <input
          class="vf-input"
          type="text"
          placeholder="Optional description…"
          formControlName="notes"
        />
      </div>

      <!-- Footer -->
      <div class="vf-footer">
        <button class="vf-btn-cancel" type="button" (click)="onCloseExpense()">Cancel</button>
        <button class="vf-btn-submit" type="submit" [disabled]="isSubmitting">
          <i class="bi bi-check-circle-fill"></i>
          {{ isSubmitting ? 'Saving…' : (isEditMode ? 'Update Expense' : 'Add Expense') }}
        </button>
      </div>

    </form>
  </div>
</div>
