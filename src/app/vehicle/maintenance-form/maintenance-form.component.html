<div class="vf-dialog">
  <!-- Header -->
  <div class="vf-header maintenance-header">
    <div class="vf-header-icon"><i class="bi bi-wrench-adjustable-circle-fill"></i></div>
    <div class="vf-header-text">
      <div class="vf-header-title">Add Maintenance</div>
      <div class="vf-header-sub">Log a service record</div>
    </div>
    <button class="vf-close-btn" type="button" (click)="onCloseMaintenance()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- Body -->
  <div class="vf-body">
    <form [formGroup]="maintenanceForm" (ngSubmit)="onMaintenanceFormSubmit()">

      <!-- Service Date + Next Due Date -->
      <div class="vf-row-2">
        <div class="vf-field">
          <label class="vf-label">
            <i class="bi bi-calendar-check vf-lbl-icon"></i> Service Date
          </label>
          <input class="vf-input" type="date" formControlName="serviceDate" />
        </div>
        <div class="vf-field">
          <label class="vf-label">
            <i class="bi bi-calendar-event vf-lbl-icon"></i> Next Due Date
          </label>
          <input class="vf-input" type="date" formControlName="nextduedate" />
        </div>
      </div>

      <!-- Type + Cost -->
      <div class="vf-row-2">
        <div class="vf-field">
          <label class="vf-label">
            <i class="bi bi-gear-fill vf-lbl-icon"></i> Maintenance Type
          </label>
          <select class="vf-select" formControlName="maintenanceType">
            <option value="" disabled>Select type</option>
            <option *ngFor="let t of maintenanceTypes" [value]="t">{{ t }}</option>
          </select>
        </div>
        <div class="vf-field">
          <label class="vf-label">
            <i class="bi bi-currency-rupee vf-lbl-icon"></i> Cost (₹)
          </label>
          <input
            class="vf-input"
            type="number"
            placeholder="0"
            min="0"
            formControlName="cost"
          />
        </div>
      </div>

      <!-- Description -->
      <div class="vf-field">
        <label class="vf-label">
          <i class="bi bi-card-text vf-lbl-icon"></i> Description
        </label>
        <textarea
          class="vf-textarea"
          rows="3"
          placeholder="Work done, parts replaced…"
          formControlName="description"
        ></textarea>
      </div>

      <!-- Footer -->
      <div class="vf-footer">
        <button class="vf-btn-cancel" type="button" (click)="onCloseMaintenance()">Cancel</button>
        <button class="vf-btn-submit" type="submit" [disabled]="isSubmitting">
          <i class="bi bi-check-circle-fill"></i>
          {{ isSubmitting ? 'Saving…' : 'Add Maintenance' }}
        </button>
      </div>

    </form>
  </div>
</div>
