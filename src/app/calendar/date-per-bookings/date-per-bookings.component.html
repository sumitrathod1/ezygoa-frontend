<div class="popup-backdrop" (click)="onClose()"></div>

<div class="popup-card">
  <div class="popup-header">
    <h3>{{ formattedDate }}</h3>
    <button class="close-btn" (click)="onClose()">✕</button>
  </div>

  <div *ngIf="bookings.length; else noData">
    <div class="booking-card" *ngFor="let b of bookings">
      <div class="booking-top">
        <strong (click)="editBooking(b)">{{ b.customer.customerName }}</strong>
        <span class="text-success fw-bold">{{ b.bookingType }}</span>
        <span
          title="Call"
          class="icon-btn call"
          (click)="callCustomer(b.customer.customerNumber)"
        >
          📞
        </span>
      </div>

      <div class="booking-row">
        <span><b>From:</b> {{ b.from }}</span>
        <span><b>To:</b> {{ b.to }}</span>
      </div>

      <div class="booking-row">
        <span><b>Amount:</b> {{ b.amount }}</span>
        <span><b>Driver:</b> {{ b.user.employeeName }}</span>
      </div>

      <div class="booking-row">
        <span><b>Pax:</b> {{ b.pax || 4 }}</span>
        <span><b>Vehicle:</b> {{ b.vehicle?.vehicleName }}</span>
      </div>
      <div class="booking-row">
        <span><b>Time:</b> {{ formatTime(b.traveltime) }}</span>
      </div>
      <div class="action-icons"></div>
    </div>
  </div>

  <ng-template #noData>
    <p class="no-bookings">No bookings found.</p>
  </ng-template>
</div>
